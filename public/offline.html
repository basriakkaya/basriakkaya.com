<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080808">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <title>Bağlantı Yok | Basri Akkaya</title>
    <style>
      :root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:20px;color:#f6f3e8;background:#080808}.terminal{width:min(100%,620px);padding:clamp(24px,7vw,48px);background:#111111;border:1px solid #30302d;border-left:3px solid #f8cc48;border-radius:8px}.command{margin:0 0 18px;color:#f8cc48;font:700 .82rem ui-monospace,SFMono-Regular,Menlo,monospace}h1{margin:0;font-size:clamp(1.8rem,8vw,2.8rem);line-height:1.15}p{margin:18px 0 0;color:#b1b0aa;line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}button,a{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;color:#f6f3e8;background:#181818;border:1px solid #30302d;border-radius:6px;font:700 .9rem inherit;text-decoration:none;cursor:pointer}button{color:#07110a;background:#f8cc48;border-color:#f8cc48}:focus-visible{outline:3px solid #f8cc48;outline-offset:3px}@media(max-width:390px){button,a{width:100%}}
    </style>
  </head>
  <body>
    <main class="terminal">
      <p class="command">$ connection_lost</p>
      <h1>İnternet bağlantısı bulunamadı.</h1>
      <p>Bu sayfa şu anda ağ bağlantısı olmadan yüklenemiyor. Bağlantı yeniden kurulduğunda tekrar deneyebilirsin.</p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Tekrar Dene</button>
        <a href="/" title="Basri Akkaya ana sayfasına dön">Ana Sayfaya Dön</a>
      </div>
    </main>
  </body>
</html>
